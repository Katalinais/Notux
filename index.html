<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Notux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Notux: tus tareas en un solo lugar. Funciona sin conexión.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notux">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-maskable-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 12 12 3l9 9M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm-3-10 2 2 4-4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 3v3M16 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-14v5l3 2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6V3Zm9 0v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0M12 19h.01"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0M12 19h.01M3 3l18 18"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a href="./" class="brand">
        <span class="brand-mark">N</span> Notux
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="./" aria-current="page"><svg class="icon" width="20" height="20"><use href="#i-home"/></svg> Inicio</a>
        <a aria-disabled="true" title="Próximamente"><svg class="icon" width="20" height="20"><use href="#i-check-circle"/></svg> Tareas</a>
        <a aria-disabled="true" title="Próximamente"><svg class="icon" width="20" height="20"><use href="#i-calendar"/></svg> Calendario</a>
        <a aria-disabled="true" title="Próximamente"><svg class="icon" width="20" height="20"><use href="#i-clock"/></svg> Horario</a>
        <a aria-disabled="true" title="Próximamente"><svg class="icon" width="20" height="20"><use href="#i-note"/></svg> Notas</a>
      </nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <a href="./" class="brand brand-mobile">
          <span class="brand-mark brand-mark-sm">N</span> Notux
        </a>
        <span id="net" class="chip chip-ok"></span>
      </header>

      <main class="main">
        <div class="container">
          <div class="page-head">
            <p id="today" class="muted"></p>
            <h1>Hola</h1>
          </div>

          <div class="stats">
            <div class="card stat"><span id="stat-overdue" class="stat-num">0</span><span class="muted small">vencidas</span></div>
            <div class="card stat"><span id="stat-soon" class="stat-num brand-text">0</span><span class="muted small">próximos 7 días</span></div>
            <div class="card stat"><span id="stat-done" class="stat-num">0</span><span class="muted small">completadas</span></div>
          </div>

          <div class="grid2">
            <section>
              <h2>Nueva tarea</h2>
              <form id="task-form" class="card form" autocomplete="off">
                <div>
                  <label class="label" for="task-title">Título</label>
                  <input id="task-title" class="input" type="text" maxlength="120" placeholder="¿Qué tienes que hacer?" required>
                </div>
                <div>
                  <label class="label" for="task-due">Fecha límite (opcional)</label>
                  <input id="task-due" class="input" type="date">
                </div>
                <button type="submit" class="btn btn-primary">Agregar tarea</button>
              </form>
            </section>

            <section>
              <h2>Tareas pendientes</h2>
              <div id="pending" class="stack"></div>

              <div id="done-section" hidden>
                <h2 class="section-gap">Completadas</h2>
                <div id="done" class="stack"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <nav class="tabbar" aria-label="Principal">
      <a href="./" aria-current="page"><svg class="icon" width="22" height="22"><use href="#i-home"/></svg> Inicio</a>
      <a aria-disabled="true"><svg class="icon" width="22" height="22"><use href="#i-check-circle"/></svg> Tareas</a>
      <a aria-disabled="true"><svg class="icon" width="22" height="22"><use href="#i-calendar"/></svg> Calendario</a>
      <a aria-disabled="true"><svg class="icon" width="22" height="22"><use href="#i-clock"/></svg> Horario</a>
      <a aria-disabled="true"><svg class="icon" width="22" height="22"><use href="#i-note"/></svg> Notas</a>
    </nav>
  </div>

  <noscript>Notux necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
